# Production stack: postgres + redis + the two app images + Caddy for
# automatic HTTPS. Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Only Caddy publishes ports to the internet (80/443). Postgres and Redis are
# bound to 127.0.0.1 only — reachable from the host (e.g. to run
# `npm run prisma:deploy` against them) but never from outside this machine.
# The api service publishes nothing at all: the web app reaches it over the
# private docker network at API_BASE_URL, and the browser never talks to it
# directly (see apps/web/src/lib/backend-client.ts).
#
# Every service below sets mem_limit/cpus (the legacy, non-Swarm resource
# keys — these apply to a plain `docker compose up`, unlike deploy.resources
# which Compose only honors reliably in Swarm mode). Limits total ~3GB of
# this box's ~3.7GB RAM, leaving headroom for the host OS, sshd, and the
# cron scripts (backup/health-check) that run natively, not in a container.
# This caps the blast radius of any one service ballooning in *steady-state
# operation* — it does NOT fix resource contention during `docker compose
# up --build` itself, since the image build runs outside these containers
# entirely; that's still bound by the host's real capacity.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 1024m
    mem_reservation: 512m
    cpus: 0.75
    environment:
      POSTGRES_USER: africahr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: africahr
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U africahr']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 320m
    mem_reservation: 128m
    cpus: 0.25
    command: --requirepass ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    mem_limit: 896m
    mem_reservation: 384m
    cpus: 0.75
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://africahr:${POSTGRES_PASSWORD}@postgres:5432/africahr
      APP_DATABASE_URL: postgresql://africahr_app:${APP_DB_PASSWORD}@postgres:5432/africahr
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      LOG_LEVEL: info
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY}
      PAYMENT_METHOD_ENCRYPTION_KEY: ${PAYMENT_METHOD_ENCRYPTION_KEY}
      PAYSTACK_SECRET_KEY: ${PAYSTACK_SECRET_KEY}
      # Both optional — the app falls back to logging instead of sending
      # (see NotificationsFeatureModule) when either is unset. Leave both
      # blank to keep that behavior.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL}
      CORS_ORIGINS: https://${APP_DOMAIN}
      # S3-compatible object storage for uploads (organization verification
      # documents, tenant logo) - see libs/platform/storage. Uploads/downloads
      # go straight from the browser to this endpoint via a signed URL, so it
      # must be a real, publicly-reachable S3-compatible provider (e.g.
      # DigitalOcean Spaces, Cloudflare R2, AWS S3) - not a container-only
      # hostname the browser can't resolve. See .env.production.example.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT}
      STORAGE_BUCKET: ${STORAGE_BUCKET}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY}
      STORAGE_REGION: ${STORAGE_REGION}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    mem_limit: 640m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:3000/api

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    mem_limit: 192m
    mem_reservation: 64m
    cpus: 0.25
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      APEX_DOMAIN: ${APEX_DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  postgres-data:
  redis-data:
  caddy-data:
  caddy-config:
